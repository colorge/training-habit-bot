name: kintore

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: kintore
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slack_sdk
      - run: python kintore.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          SLACK_TIMES_CHANNEL_ID: ${{ secrets.SLACK_TIMES_CHANNEL_ID }}
          REMIND_TIME: "23:48"
          DEADLINE_TIME: "23:59"
